name: Rock (chiseled image)

# Builds the chiseled rock (rockcraft.yaml), runs the container and smoke-tests it
on:
  push:
    branches:
      - self-host
      - feat/rock-creation # TODO; TEMPORARY: for testing this workflow; remove before merging
  workflow_dispatch: # allow manual runs at any time

permissions:
  contents: read
  issues: write # needed to open the failure-notification issue (last step)

concurrency:
  group: rock-${{ github.ref }}
  cancel-in-progress: true # rock builds are long; supersede stale runs

jobs:
  pack-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true # the build needs the habitica-images assets

      - name: Set up Rockcraft and LXD
        run: |
          snap list lxd 2>/dev/null || sudo snap install lxd
          sudo lxd init --auto
          sudo adduser "$USER" lxd
          sudo snap install rockcraft --classic
          # GitHub runners have Docker preinstalled, whose DROP policy on the
          # iptables FORWARD chain silently kills LXD bridge networking.
          # Whitelist the LXD bridge in Docker's DOCKER-USER chain.
          sudo iptables -I DOCKER-USER -i lxdbr0 -j ACCEPT
          sudo iptables -I DOCKER-USER -o lxdbr0 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT

      # `sg lxd` picks up the lxd group membership granted above without
      # needing a new login session
      - name: Pack the rock
        run: sg lxd -c "rockcraft pack"

      # Resolve right after packing: if the .rock is missing, `ls` fails here
      - name: Resolve rock file and version
        run: |
          echo "ROCK_FILE=$(ls habitica-app_*_amd64.rock)" >> "$GITHUB_ENV"
          echo "ROCK_VERSION=$(grep '^version:' rockcraft.yaml | tr -d '" ' | cut -d: -f2)" >> "$GITHUB_ENV"

      - name: Load the rock into Docker
        run: |
          sudo rockcraft.skopeo copy --insecure-policy \
            oci-archive:${ROCK_FILE} \
            docker-daemon:habitica-app:${ROCK_VERSION}

      - name: Start the rock via docker compose
        run: docker compose -f docker-compose-rock.yaml up -d

      - name: Smoke test — API comes up
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/v3/status | grep -q '"status":"up"'; then
              echo "Habitica API is up"
              exit 0
            fi
            sleep 5
          done
          echo "Habitica API did not come up within 5 minutes"
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose -f docker-compose-rock.yaml logs || true

      # Open an issue in case of failure
      # I can volunteer to maintain the rock;
      # if any issues arise with automated build, I'll take a look
      - name: Raise failure-notification issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Rock build failed on ${{ github.ref_name }} (${{ github.sha }})"
          body="The rock build/smoke test failed for commit ${{ github.sha }}.

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          cc @Soundarya03"

          existing=$(gh issue list --search "\"${title}\" in:title state:open" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
