name: habitica-app
summary: Habitica app
description: Chiseled rock for the Habitica app, composed of server, frontend and cron jobs
version: "1.0"

base: bare
build-base: ubuntu@24.04

platforms:
  amd64:

services:
  habitica:
    override: replace
    command: node website/transpiled-babel/index.js
    startup: enabled
    working-dir: /var/lib/habitica
    environment:
      NODE_ENV: production
  cron:
    override: replace
    command: cron -f
    startup: enabled


parts:

  habitica:
    plugin: nil
    source: .
    build-packages:
      - git
      - build-essential
      - python3
      - libkrb5-dev
      - nodejs
      - npm
    stage-packages:
      - nodejs_bins
    override-build: |
      # Ensure git over https
      git config --global url."https://".insteadOf git://

      # Install backend deps, skipping the postinstall script
      npm pkg set scripts.postinstall="echo \"Skipping postinstall\"" && npm install

      # Install frontend deps, also skipping its postinstall script
      cd website/client
      npm pkg set scripts.postinstall="echo \"Skipping postinstall\"" && npm install

      # Go back to project root
      cd $CRAFT_PART_BUILD

      # Populate the habitica-images submodule (pinned to the commit recorded
      # in this repo): the rock's source copy only contains the working tree,
      # which has an empty habitica-images/ dir unless the submodule was initialized locally.
      # This command is a cheap no-op if it was.
      git submodule update --init --depth 1 habitica-images

      # Copy assets into the public directory for being included in the release
      mkdir -p website/client/public/static/mobileApp/images/
      find habitica-images \( -iname "*.gif" -o -iname "*.png" \) -exec cp -t website/client/public/static/mobileApp/images/ {} \;

      # Replace media URLs to AWS with relative paths
      # NB: `|| true` + `xargs -r` keep the build alive when nothing matches
      # (grep exits non-zero and scriptlets run with `set -o pipefail`)
      { grep -rl --exclude-dir=.git "https://habitica-assets.s3.amazonaws.com/" . || true; } | xargs -r sed -i 's#https://habitica-assets.s3.amazonaws.com/#/static/#g'

      # Replace mobile app sound paths with static audio paths
      { grep -rl --exclude-dir=.git "/static/mobileApp/sounds/" . || true; } | xargs -r sed -i 's#/static/mobileApp/sounds/#/static/audio/#g'

      # Generate config.json
      cat > config.json << 'EOF'
      {
      "BASE_URL": "http://localhost:3000",
      "NODE_ENV": "production",
      "PORT": 3000,
      "CRON_SAFE_MODE": "false",
      "CRON_SEMI_SAFE_MODE": "false",
      "DISABLE_REQUEST_LOGGING": "true",
      "EMAIL_SERVER_AUTH_PASSWORD": "",
      "EMAIL_SERVER_AUTH_USER": "",
      "EMAIL_SERVER_URL": null,
      "ENABLE_CONSOLE_LOGS_IN_PROD": "true",
      "ENABLE_CONSOLE_LOGS_IN_TEST": "false",
      "FLAG_REPORT_EMAIL": "",
      "IGNORE_REDIRECT": "true",
      "INVITE_ONLY": "false",
      "MAINTENANCE_MODE": "false",
      "MONGODB_POOL_SIZE": "10",
      "PATH": "bin:node_modules/.bin:/usr/local/bin:/usr/bin:/bin",
      "PUSH_CONFIGS_APN_ENABLED": "false",
      "SESSION_SECRET": "YOUR SECRET HERE",
      "SESSION_SECRET_IV": "12345678912345678912345678912345",
      "SESSION_SECRET_KEY": "1234567891234567891234567891234567891234567891234567891234567891",
      "TRUSTED_DOMAINS": "",
      "WEB_CONCURRENCY": 1,
      "ENABLE_STACKDRIVER_TRACING": "false",
      "BLOCKED_IPS": "",
      "LOG_AMPLITUDE_EVENTS": "false",
      "RATE_LIMITER_ENABLED": "false",
      "CONTENT_SWITCHOVER_TIME_OFFSET": 8
      }
      EOF

      # Build backend, then frontend
      ./node_modules/.bin/gulp build:prod
      npm run client:build

      # Install into final location...
      mkdir -p $CRAFT_PART_INSTALL/var/lib/habitica/website

      # ...compiled output (dev deps pruned first)...
      npm prune --omit=dev
      npm --prefix website/client prune --omit=dev
      cp -r node_modules $CRAFT_PART_INSTALL/var/lib/habitica/
      cp -r website $CRAFT_PART_INSTALL/var/lib/habitica

      cp -r content_cache $CRAFT_PART_INSTALL/var/lib/habitica
      cp -r i18n_cache $CRAFT_PART_INSTALL/var/lib/habitica

      # ...and runtime config.
      cp config.json \
        package.json \
        $CRAFT_PART_INSTALL/var/lib/habitica/

  cron:
      plugin: nil
      source: .
      stage-packages:
        - cron_daemon
        - cron_config
      override-build: |
        # cron writes /run/crond.reboot at startup and refuses to run without
        # it; keep the Debian layout of /var/run as a symlink to /run
        mkdir -p $CRAFT_PART_INSTALL/run
        ln -sfn /run $CRAFT_PART_INSTALL/var/run

        # The job command sources /etc/environment and appends to /var/log/cron.log, so both must exist
        touch $CRAFT_PART_INSTALL/etc/environment
        mkdir -p $CRAFT_PART_INSTALL/var/log

        # Install the job as root's crontab.
        # Placing file in /etc/cron.d won't work: files there require user field, which this doesn't have.
        mkdir -p $CRAFT_PART_INSTALL/var/spool/cron/crontabs
        cp scripts/team-cron/habiticateamcron $CRAFT_PART_INSTALL/var/spool/cron/crontabs/root

        # The crontab hardcodes /usr/local/bin/node (the node:20 image layout);
        # the nodejs_bins slice provides /usr/bin/node instead
        sed -i 's#/usr/local/bin/node#/usr/bin/node#' $CRAFT_PART_INSTALL/var/spool/cron/crontabs/root
        chmod 0600 $CRAFT_PART_INSTALL/var/spool/cron/crontabs/root

        # Scripts executed by the crontab
        mkdir -p $CRAFT_PART_INSTALL/var/lib/habitica/scripts
        cp scripts/team-cron.js $CRAFT_PART_INSTALL/var/lib/habitica/scripts/
        cp scripts/team-cron/run-team-cron.js $CRAFT_PART_INSTALL/var/lib/habitica/
